@let workspace = current(); @if (workspace) {
<button
  type="button"
  class="flex min-h-touch max-w-40 items-center gap-1 truncate rounded-btn px-2 text-sm font-medium text-text-secondary hover:bg-background"
  [attr.aria-label]="
    'shell.workspace.triggerLabel' | transloco: triggerLabelParams()
  "
  [cdkMenuTriggerFor]="hasMultiple() ? workspaceMenu : null"
>
  <span class="truncate">{{ workspace.name }}</span>
</button>

<ng-template #workspaceMenu>
  <div
    cdkMenu
    class="min-w-40 rounded-card border border-border bg-background py-1"
  >
    @for (item of workspaces(); track item.id) {
    <button
      cdkMenuItem
      type="button"
      class="block w-full min-h-touch px-4 py-2 text-left text-sm text-text-primary hover:bg-surface"
      [attr.aria-current]="item.id === workspace.id ? 'true' : null"
      (click)="selectWorkspace(item.id)"
    >
      {{ item.name }}
    </button>
    }
  </div>
</ng-template>
}
