# Deliberately NO `packages` globs: this is an integrated Nx workspace with a single
# root importer. Per-project package.json files (libs/**, apps/api, apps/cli) are
# metadata for the Nx graph and @nx/dependency-checks, NOT pnpm workspace members —
# adding them as importers would fork installs and rewrite the lockfile. Revisit only
# if/when Docker deployment adopts Nx's pruned per-app install flow.
saveExact: true
strictDepBuilds: true
allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  less: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nx/angular@23.0.1'
  - '@nx/devkit@23.0.1'
  - '@nx/docker@23.0.1'
  - '@nx/esbuild@23.0.1'
  - '@nx/eslint-plugin@23.0.1'
  - '@nx/eslint@23.0.1'
  - '@nx/jest@23.0.1'
  - '@nx/js@23.0.1'
  - '@nx/module-federation@23.0.1'
  - '@nx/node@23.0.1'
  - '@nx/nx-darwin-arm64@23.0.1'
  - '@nx/nx-darwin-x64@23.0.1'
  - '@nx/nx-freebsd-x64@23.0.1'
  - '@nx/nx-linux-arm-gnueabihf@23.0.1'
  - '@nx/nx-linux-arm64-gnu@23.0.1'
  - '@nx/nx-linux-arm64-musl@23.0.1'
  - '@nx/nx-linux-x64-gnu@23.0.1'
  - '@nx/nx-linux-x64-musl@23.0.1'
  - '@nx/nx-win32-arm64-msvc@23.0.1'
  - '@nx/nx-win32-x64-msvc@23.0.1'
  - '@nx/playwright@23.0.1'
  - '@nx/rspack@23.0.1'
  - '@nx/vite@23.0.1'
  - '@nx/vitest@23.0.1'
  - '@nx/web@23.0.1'
  - '@nx/webpack@23.0.1'
  - '@nx/workspace@23.0.1'
  - nx@23.0.1
  - '@nx/nest@23.0.1'
