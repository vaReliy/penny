# Nginx configuration for penny Angular SPA
# Serves static files and proxies API requests to the backend

# Map to extract the original URI path (before any rewrites) by stripping query string from $request_uri.
# This must happen at the http level before any location directives, since internal rewrites (try_files)
# cause location re-matching and would reset a location-level 'set' directive. $request_uri is the
# original request, so this captures the true client path for accurate logging.
map $request_uri $original_uri {
  ~^(?<path>[^?]*).*$ $path;
}

upstream api {
  server api:3000;
}

# Gzip compression for static assets
gzip on;
gzip_types text/plain text/css text/javascript application/json application/javascript;
gzip_min_length 1000;

# Log format that excludes query string parameters to prevent sensitive data (e.g., Telegram hash) from being logged
# Uses $original_uri (captured before any rewrites) instead of $uri to preserve the actual requested path
# $http_referer is deliberately omitted because Referrer-Policy: strict-origin-when-cross-origin
# causes the browser to send the full originating URL (including sensitive query params) as the Referer header
# on same-origin requests (e.g., POST from /login?id=...&hash=... to /api/auth/telegram)
log_format scrubbed '$remote_addr - $remote_user [$time_local] '
  '"$request_method $original_uri $server_protocol" $status $body_bytes_sent '
  '"$http_user_agent"';

server {
  listen 8080;
  server_name _;

  access_log /var/log/nginx/access.log scrubbed;

  root /usr/share/nginx/html;
  index index.html;

  # Security headers
  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Health check endpoint (no-op for Kubernetes/Docker Compose)
  location /health {
    access_log off;
    return 200 "OK\n";
    add_header Content-Type text/plain;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # API proxy: forward all /api requests to the backend
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_redirect off;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Hide upstream headers to prevent duplication; server block's values become canonical
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
  }

  # Cache-busting: hashed assets (*.js, *.css with hash in filename)
  # These have long cache times since their names change on every build
  location ~* \.(js|css)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Static assets (images, fonts, etc.)
  location ~* \.(jpg|jpeg|png|gif|ico|woff|woff2|ttf|svg|eot)$ {
    expires 30d;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Main HTML file: no cache so users always get the latest index.html
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # CSP nonce injection for Angular's runtime-injected component styles.
    #
    # The build sets optimization.styles.inlineCritical=false, so index.html ships a plain
    # render-blocking <link rel="stylesheet"> — no inline <style> block and no inline onload
    # handler. That is deliberate: a CSP nonce cannot authorize an inline event handler
    # (only 'unsafe-inline' or 'unsafe-hashes' can), so the async-CSS trick is unfixable
    # under a strict policy and was silently serving every user an unstyled page.
    #
    # Angular still injects component styles as <style> elements at runtime and nonces them
    # from the csp-nonce meta, so style-src keeps its nonce and the meta is still filled in
    # per request. Note the meta serializes as content="" only when inlineCritical is off —
    # with it on, the HTML post-processor rewrites it to a bare `content`. The smoke check
    # exists to catch exactly that kind of markup drift.
    gzip off;
    sub_filter_once off;
    sub_filter_types text/html;
    sub_filter 'name="csp-nonce" content=""' 'name="csp-nonce" content="$request_id"';
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org 'nonce-$request_id'; style-src 'self' 'nonce-$request_id'; frame-src https://oauth.telegram.org; connect-src 'self'; img-src 'self' https://t.me https://*.telegram.org data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
  }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }
}
