services:
  mongodb:
    image: mongo:7
    container_name: penny-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: penny
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
    driver: local
