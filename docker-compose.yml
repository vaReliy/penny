# Production-like Docker Compose configuration for penny
# For local testing of multi-container setup.
# Uses environment variables from .env file.

services:
  # MongoDB database
  mongo:
    image: mongo:7
    container_name: penny-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-penny}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - penny_net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    expose:
      - '27017'

  # NestJS API backend
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: penny-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB_NAME:-penny}?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME:-penny}
      JWT_SECRET: ${JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
    networks:
      - penny_net
    expose:
      - '3000'
    healthcheck:
      test: >-
        node -e "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Angular SPA frontend (served by Nginx)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
    container_name: penny-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - penny_net
    ports:
      - '80:8080'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:8080/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  penny_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
