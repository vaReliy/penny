name: CI

on:
  pull_request:
    branches: [main, skeleton]
  push:
    branches: [main, skeleton]

permissions:
  contents: read

env:
  NX_DAEMON: false

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 15s
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: penny-test
          MONGO_INITDB_ROOT_USERNAME: test-user
          MONGO_INITDB_ROOT_PASSWORD: test-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive Nx affected base/head
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check exact pins
        run: node tools/check-exact-pins.mjs

      - name: Lint, test, build affected projects
        run: pnpm nx affected -t lint,vite:test,typecheck,build
        env:
          # MongoDB service container (mongo:7) is available in this job via services.mongo.
          # Uses root user (from services.mongo env vars MONGO_INITDB_ROOT_USERNAME/PASSWORD).
          # Tests connect to penny-test database on localhost:27017.
          MONGO_TEST_URI: 'mongodb://test-user:test-password@localhost:27017/penny-test?authSource=admin'
        # Note on targets:
        # - Nx plugins @nx/vitest (testTargetName: vite:test) and @nx/vite/plugin
        #   (typecheckTargetName: typecheck) register these inferred targets.
        # - vite:test: 16 projects (all libs + web + api + cli)
        # - test target removed: api/cli have explicit test targets (run-commands → vitest)
        #   AND vitest.config.mts files that trigger vite:test inference. Keeping both
        #   would run vitest twice on those projects. vite:test is sufficient.
        # - typecheck: 5 projects (feature-* libs + web) — others without tsconfig.lib.json
        #   don't infer it; leaves known gap: typecheck doesn't include .spec.ts scope
        #   (see KNOWLEDGE_INBOX 2026-07-08)
        #
        # MongoDB-dependent tests: libs/identity/infrastructure/{mongo-*.spec.ts}
        # - RUN in CI via GitHub Actions MongoDB service container (mongo:7).
        # - MONGO_TEST_URI env var is set above to enable connection to service container.
        # - Tests REQUIRE Mongo and will fail hard (ECONNREFUSED, undefined.dropDatabase(), etc.)
        #   without it. No graceful skip: they connect immediately in beforeAll/describe, not lazily.

      - name: Audit dependencies (non-blocking)
        run: pnpm audit || true

  # Run Playwright e2e tests on web-e2e only.
  # Scope decision:
  # - web-e2e is IN: hermetic tests, API mocked, no live service dependencies
  # - smoke-e2e is OUT: depends on docker-compose stack + container health checks
  #   (deferred; requires task 2026-07-07-01 web healthcheck; can be picked up later)
  # - api-e2e is OUT: Jest-based tests requiring live MongoDB + running API server
  #   (different infra requirements; not appropriate for this hermetic CI job)
  # Runs after main lint/test/build passes; uses built web app for testing
  e2e:
    runs-on: ubuntu-latest
    needs: [ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive Nx affected base/head
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm nx build web

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Key based on Playwright version in lockfile ensures cache invalidation
          # when dependencies change, without storing per-browser breakdowns
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers (Chromium only for CI speed)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: pnpm nx affected -p web-e2e -t e2e
        env:
          # Signal to playwright.config.mts that we're running in CI
          CI: 'true'

  # Build Docker images for all applications
  # Runs after main CI passes, uses layer caching for faster rebuilds
  build-images:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Note: packages: write must be restored alongside docker/login-action + push: true
    # when registry push is intentionally added in the future
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          tags: penny-api:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CLI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/cli/Dockerfile
          tags: penny-cli:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          tags: penny-web:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
