name: CI

on:
  pull_request:
    branches: [main, skeleton]
  push:
    branches: [main, skeleton]

permissions:
  contents: read

env:
  NX_DAEMON: false

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\"" --health-interval 10s --health-timeout 5s --health-retries 5 --health-start-period 15s


        ports:
          - 27017:27017
        env:
          MONGO_INITDB_DATABASE: penny-test
          MONGO_INITDB_ROOT_USERNAME: test-user
          MONGO_INITDB_ROOT_PASSWORD: test-password
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Derive Nx affected base/head
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
        with:
          main-branch-name: 'main'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check exact pins
        run: node tools/check-exact-pins.mjs

      - name: Generate Angular environment files
        # web:typecheck/test/build all resolve apps/web/src/app/app.config.ts,
        # which imports the git-ignored ../environments/environment. Any job running
        # an nx target against `web` must generate it first (see tools/generate-web-env.mjs).
        run: node tools/generate-web-env.mjs

      - name: Root-level lint (path-anchored rules)
        run: pnpm nx lint:root
        # Root-level lint covers path-anchored ESLint rules (e.g., .js-extension gate,
        # localStorage ban, @Injectable ban) that are dead under per-project linting
        # due to basePath resolution. This runs from the repo root where root-relative
        # globs work natively. Must run before per-project lint to catch violations.

      - name: Lint, test, build affected projects
        run: pnpm nx affected -t lint,test,typecheck,build
        env:
          # MongoDB service container (mongo:7) is available in this job via services.mongo.
          # Uses root user (from services.mongo env vars MONGO_INITDB_ROOT_USERNAME/PASSWORD).
          # Tests connect to penny-test database on localhost:27017.
          MONGO_TEST_URI: 'mongodb://test-user:test-password@localhost:27017/penny-test?authSource=admin'
        # Note on targets:
        # - Nx plugins @nx/vitest (testTargetName: test) and @nx/vite/plugin
        #   (typecheckTargetName: typecheck) register these inferred targets.
        # - test: 16 projects (all libs + web + api + cli), inferred from vitest.config.mts.
        #   This list must stay in lockstep with nx.json plugin registrations — nx affected
        #   silently skips projects when a named target does not exist (no error).
        # - typecheck: runs on every project that exposes a typecheck target — both the
        #   ones @nx/vite/plugin infers automatically and the ones with a manually-added
        #   nx:run-commands target following that same tsc --noEmit pattern (see
        #   rules/nx-generators.md). Known gap: targets that typecheck against
        #   tsconfig.spec.json still only catch spec-file type errors where a project
        #   opted into that scope — not a blanket guarantee across all projects.
        #
        # MongoDB-dependent tests: libs/identity/infrastructure/{mongo-*.spec.ts}
        # - RUN in CI via GitHub Actions MongoDB service container (mongo:7).
        # - MONGO_TEST_URI env var is set above to enable connection to service container.
        # - Tests REQUIRE Mongo and will fail hard (ECONNREFUSED, undefined.dropDatabase(), etc.)
        #   without it. No graceful skip: they connect immediately in beforeAll/describe, not lazily.

      - name: Audit dependencies (non-blocking)
        run: pnpm audit || true

  # Run Playwright e2e tests on web-e2e only.
  # Scope decision:
  # - web-e2e is IN: hermetic tests, API mocked, no live service dependencies
  # - smoke-e2e is OUT: depends on the full docker-compose stack (mongo + api + web,
  #   including the api/web container health checks) coming up healthy; the compose
  #   stack itself works, but wiring a CI job to build/boot/tear down the multi-container
  #   stack is separate, unstarted work — can be picked up when a CI-friendly compose
  #   invocation is designed.
  # - api-e2e is OUT: Jest-based tests requiring live MongoDB + running API server
  #   (different infra requirements; not appropriate for this hermetic CI job)
  # Runs after main lint/test/build passes; uses built web app for testing
  e2e:
    runs-on: ubuntu-latest
    needs: [ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Derive Nx affected base/head
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5
        with:
          main-branch-name: 'main'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Angular environment files
        run: node tools/generate-web-env.mjs

      - name: Build web app
        run: pnpm nx build web

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          # Key based on Playwright version in lockfile ensures cache invalidation
          # when dependencies change, without storing per-browser breakdowns
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers (Chromium only for CI speed)
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: pnpm nx affected -t e2e --exclude=smoke-e2e,api-e2e
        env:
          # Signal to playwright.config.mts to use serve-static (built artifact) instead of dev server
          CI: 'true'

  # Build Docker images for all applications
  # Runs after main CI passes, uses layer caching for faster rebuilds
  build-images:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Note: packages: write must be restored alongside docker/login-action + push: true
    # when registry push is intentionally added in the future
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          tags: penny-api:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CLI image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./apps/cli/Dockerfile
          tags: penny-cli:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          tags: penny-web:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            # TELEGRAM_BOT_USERNAME secret must be configured in Settings > Secrets and variables > Actions.
            # See docs/CI_SECRETS.md for setup instructions.
            TELEGRAM_BOT_USERNAME=${{ secrets.TELEGRAM_BOT_USERNAME }}
