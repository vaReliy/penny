name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  NX_DAEMON: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive Nx affected base/head
        uses: nrwl/nx-set-shas@v5
        with:
          main-branch-name: 'main'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check exact pins
        run: node tools/check-exact-pins.mjs

      - name: Lint, test, build affected projects
        run: pnpm nx affected -t lint,test,build

      - name: Audit dependencies (non-blocking)
        run: pnpm audit || true

  # Build Docker images for all applications
  # Runs after main CI passes, uses layer caching for faster rebuilds
  build-images:
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Note: packages: write must be restored alongside docker/login-action + push: true
    # when registry push is intentionally added in the future
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          tags: penny-api:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build CLI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/cli/Dockerfile
          tags: penny-cli:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          tags: penny-web:latest
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
