name: PR Management Agent

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering
  pull_request:
    types: [opened, reopened, synchronize]
    # Only run on PRs from bot accounts

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  manage-prs:
    runs-on: ubuntu-latest
    # Run on schedule/manual trigger OR for PRs from bot accounts only
    # This ensures the agent can process all open PRs on schedule while
    # also reacting to new bot PRs immediately
    if: github.actor == 'dependabot[bot]' || github.actor == 'github-actions[bot]' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PR Management Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/manage-prs.js
