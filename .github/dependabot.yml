version: 2
updates:
  # NPM dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    # Target `develop` instead of `main`: main is a fast-forward-only release branch synced from develop.
    # Dependabot PRs land on develop, where they can be reviewed and merged into the integration flow.
    # A PR against main would block the release branch's immutability invariant.
    target-branch: 'develop'
    open-pull-requests-limit: 10
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '03:00'
    groups:
      # Angular packages must move in lockstep
      angular:
        patterns:
          - '@angular/*'
      # NestJS packages should update together
      nestjs:
        patterns:
          - '@nestjs/*'
      # Tailwind ecosystem
      tailwind:
        patterns:
          - 'tailwindcss'
          - '@tailwindcss/*'
      # Development tools
      dev-tools:
        patterns:
          - 'nx'
          - 'esbuild'
          - 'vite'
          - 'webpack*'
      # Security-scoped groups keep peer-locked package families in a single PR.
      # Defined before the catch-all security group so they match first (Dependabot uses first match).
      # Grouping ensures alerted packages arrive in one PR; CI now gates peer conflicts (see ci.yml).
      angular-security:
        applies-to: security-updates
        patterns:
          - '@angular/*'
      nestjs-security:
        applies-to: security-updates
        patterns:
          - '@nestjs/*'
      dev-tools-security:
        applies-to: security-updates
        patterns:
          - 'nx'
          - 'esbuild'
          - 'vite'
          - 'webpack*'
      # Security fixes arrive as their own smaller PR stream, separate from regular version updates
      security:
        applies-to: security-updates
        patterns:
          - '*'
      # Regular version updates for everything else
      other:
        applies-to: version-updates
        patterns:
          - '*'
    # Cooldown delays routine version updates to avoid picking up freshly-published compromised
    # releases. Applies only to version updates, not security updates — security updates proceed immediately.
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    # Disable rebase to keep PRs in sync with the group strategy
    rebase-strategy: 'disabled'
    # Require exact versions (no ^ or ~) — the tool will not append these
    # but this comment serves as documentation of the requirement.
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    pull-request-branch-name:
      separator: '/'
    assignees:
      - 'vaReliy'
    versioning-strategy: increase
